[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lokales-vorlagen-tool"
version = "0.1.0"
description = "Lokale Desktop-App: Versicherungsdokumente lesen, Daten pruefen, Originalvorlagen (PDF) befuellen - ohne Cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = [
  "PySide6>=6.6",
  "PyMuPDF>=1.24",
  "pypdf>=4.0",
  "pypdfium2>=4.25",
  "pydantic>=2.6",
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "numpy>=1.26",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6.5"]
# Optionale OCR-Backends (schwergewichtig, nur bei Bedarf installieren)
rapidocr = ["rapidocr_onnxruntime>=1.3"]
docling = ["docling>=2.0"]
localai = ["psutil>=5"]

[project.scripts]
lokales-vorlagen-tool = "insurance_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "slow: langsame Tests (OCR, Rendering)",
  "ui: Tests der Qt-Oberflaeche (offscreen)",
  "originals: Tests mit den echten Swiss-Life-Originalvorlagen",
]
filterwarnings = [
  "ignore:The `fitz` API is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S"]
